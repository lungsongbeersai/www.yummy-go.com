name: Deploy Next SSR (versioned standalone)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-next-ssr-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required configuration
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_API_URL NEXT_PUBLIC_BASE_URL; do
            test -n "${!name}" || { echo "Missing configuration: $name"; exit 1; }
          done

      - name: Install and verify
        run: |
          npm ci --include=optional
          npx next typegen
          npm run typecheck
          npm run lint
          npm test
          node --test scripts/deploy/deploy-release.test.mjs

      - name: Build and package standalone on CI
        shell: bash
        env:
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          NEXT_PUBLIC_PRINTER_AGENT_URL: ${{ secrets.NEXT_PUBLIC_PRINTER_AGENT_URL }}
          NEXT_PUBLIC_PRINTER_AGENT_SECRET: ${{ secrets.NEXT_PUBLIC_PRINTER_AGENT_SECRET }}
          NEXT_PUBLIC_BASE_PATH: ${{ secrets.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_MOBILE_TCP_DEBUG: ${{ secrets.NEXT_PUBLIC_MOBILE_TCP_DEBUG }}
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_SOCKET_URL NEXT_PUBLIC_PRINTER_AGENT_URL NEXT_PUBLIC_PRINTER_AGENT_SECRET NEXT_PUBLIC_BASE_PATH NEXT_PUBLIC_MOBILE_TCP_DEBUG; do
            test -n "${!name}" || unset "$name"
          done
          npm run build
          node scripts/deploy/package-release.mjs . "$RUNNER_TEMP/yummygo-$RELEASE_ID.tar.gz" "$RELEASE_ID"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Transfer and activate release
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          REMOTE_DIR=$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mktemp -d /tmp/yummygo-deploy-XXXXXXXX')
          [[ "$REMOTE_DIR" =~ ^/tmp/yummygo-deploy-[a-zA-Z0-9]+$ ]] || { echo "Invalid remote temporary directory"; exit 1; }
          trap 'ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "rm -rf -- $REMOTE_DIR" || true' EXIT
          scp -P "$SSH_PORT" "$RUNNER_TEMP/yummygo-$RELEASE_ID.tar.gz" "$SSH_USER@$SSH_HOST:$REMOTE_DIR/release.tar.gz"
          scp -P "$SSH_PORT" scripts/deploy/activate-release.sh "$SSH_USER@$SSH_HOST:$REMOTE_DIR/activate-release.sh"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "sudo bash $REMOTE_DIR/activate-release.sh $REMOTE_DIR/release.tar.gz $RELEASE_ID"

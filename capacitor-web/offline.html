<!doctype html>
<html lang="lo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Yummy Go</title>
    <style>
      :root {
        color-scheme: light dark;
        --brand: #16a34a;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --fg: #f1f5f9;
          --muted: #94a3b8;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        padding-top: max(1.5rem, env(safe-area-inset-top));
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Lao",
          sans-serif;
        text-align: center;
      }
      .logo {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 1rem;
        background: var(--brand);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 700;
        font-size: 1.5rem;
      }
      h1 {
        font-size: 1.125rem;
        margin: 0;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.875rem;
        max-width: 22rem;
        line-height: 1.5;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: var(--muted);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      button {
        margin-top: 0.5rem;
        border: none;
        border-radius: 0.6rem;
        background: var(--brand);
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.6rem 1.5rem;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="logo">YG</div>
    <h1>ບໍ່ມີການເຊື່ອມຕໍ່ອິນເຕີເນັດ</h1>
    <p>ກະລຸນາກວດສອບການເຊື່ອມຕໍ່ Wi-Fi ຫຼືອິນເຕີເນັດຂອງອຸປະກອນນີ້. ແອັບຈະໂຫຼດເອງອັດຕະໂນມັດທັນທີທີ່ເຊື່ອມຕໍ່ໄດ້.</p>
    <div class="status">
      <span class="dot"></span>
      <span id="status-text">ກຳລັງກວດສອບການເຊື່ອມຕໍ່...</span>
    </div>
    <button id="retry">ລອງໃໝ່ອີກຄັ້ງ</button>
    <script>
      // ไฟล์นี้โหลดตอน WKWebView/Android WebView ไปหน้าแรก (server.url) ไม่ติดจริงๆ
      // (capacitor.config.ts server.errorPath) — ยังไม่มี Next.js/React ให้ใช้ตรงนี้
      // ต้อง vanilla JS ล้วนๆ ฮาร์ดโค้ด production URL ไว้ตรงๆ เพราะไฟล์นี้ build
      // ครั้งเดียวติดไปกับแอป ไม่รู้ค่า CAPACITOR_SERVER_URL ของเครื่อง dev ที่ build ครั้งนั้น
      var APP_URL = "https://yummy-go.com";
      var statusText = document.getElementById("status-text");
      var retryButton = document.getElementById("retry");

      function goToApp() {
        window.location.href = APP_URL;
      }

      function checkNow() {
        statusText.textContent = "ກຳລັງກວດສອບການເຊື່ອມຕໍ່...";
        fetch(APP_URL, { mode: "no-cors", cache: "no-store" })
          .then(function () {
            goToApp();
          })
          .catch(function () {
            statusText.textContent = "ຍັງບໍ່ມີການເຊື່ອມຕໍ່";
          });
      }

      retryButton.addEventListener("click", goToApp);
      window.addEventListener("online", checkNow);
      setInterval(checkNow, 5000);
      checkNow();
    </script>
  </body>
</html>
